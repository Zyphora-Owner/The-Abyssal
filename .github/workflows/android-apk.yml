name: Build The Abyssal Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    env:
      ABYSSAL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ABYSSAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify game source
        run: npm test

      - name: Configure online services
        run: node scripts/configure-backend.mjs

      - name: Build Android project
        run: npm run android:add

      - name: Compile APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-abyssal-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
