name: Build The Abyssal 4.1.0 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: abyssal-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Verify source and compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout source archive parts and workflow
        uses: actions/checkout@v7.0.1

      - name: Reassemble source archive and verify SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Archive validation failed at line ${LINENO} (exit ${rc})."; exit "$rc"' ERR

          PART1="The_Abyssal_v4.1.0.zip.part01"
          PART2="The_Abyssal_v4.1.0.zip.part02"
          CHECKSUM_FILE="The_Abyssal_Standalone_Android_v4.1.0.zip.sha256"
          ARCHIVE="$RUNNER_TEMP/The_Abyssal_Standalone_Android_v4.1.0.zip"
          EXTRACT_DIR="$RUNNER_TEMP/the-abyssal-v4.1.0"

          echo "=== Checking uploaded source files ==="
          for file in "$PART1" "$PART2" "$CHECKSUM_FILE"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty file: $file"
              echo "Repository root contents:"
              ls -lah
              exit 1
            fi
            stat -c '%n: %s bytes' "$file"
          done

          echo "=== Reassembling ZIP parts in order ==="
          cat "$PART1" "$PART2" > "$ARCHIVE"
          test -s "$ARCHIVE"

          EXPECTED_SHA256="$(grep -Eo '[[:xdigit:]]{64}' "$CHECKSUM_FILE" | head -n 1 || true)"
          EXPECTED_SHA256="${EXPECTED_SHA256,,}"
          if [[ ! "$EXPECTED_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::The checksum file does not contain a valid 64-character SHA-256 value."
            cat "$CHECKSUM_FILE"
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $ACTUAL_SHA256"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::SHA-256 mismatch. Make sure both parts and checksum belong to the same release."
            exit 1
          fi
          echo "SHA-256 verification passed."

          echo "=== Testing ZIP structure ==="
          unzip -tq "$ARCHIVE"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          echo "=== Locating project root ==="
          mapfile -t VERIFY_FILES < <(find "$EXTRACT_DIR" -type f -path '*/scripts/verify.mjs' -print)
          PROJECT_DIR=""
          for verify_script in "${VERIFY_FILES[@]}"; do
            candidate="$(dirname "$(dirname "$verify_script")")"
            if [[ -f "$candidate/package.json" && -f "$candidate/index.html" ]]; then
              if [[ -n "$PROJECT_DIR" ]]; then
                echo "::error::More than one possible project root was found."
                exit 1
              fi
              PROJECT_DIR="$candidate"
            fi
          done

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not find package.json, index.html and scripts/verify.mjs in one project directory."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          for required in \
            package.json \
            index.html \
            scripts/verify.mjs \
            scripts/patch-android.mjs \
            native/abyssal-debug-signing.bin \
            native/android-icons/mipmap-anydpi-v26/ic_launcher.xml \
            native/android-icons/mipmap-anydpi-v26/ic_launcher_round.xml; do
            if [[ ! -s "$PROJECT_DIR/$required" ]]; then
              echo "::error::Required project file missing or empty: $required"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          echo "Source archive validation completed."

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Validate optional Supabase configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/configure-backend.mjs

      - name: Verify stable debug signing key
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="native/abyssal-debug-signing.bin"
          test -s "$KEYSTORE"
          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey >/dev/null
          echo "Stable debug signing key verified."

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install \
            --no-audit \
            --no-fund \
            --fetch-retries=4 \
            --fetch-timeout=180000

      - name: Run complete source and asset verification
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm test

      - name: Build web bundle and prepare Capacitor Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d android ]; then
            echo "Existing Android project found; syncing Capacitor."
            npm run android:sync
          else
            echo "Android project not found; creating Capacitor Android project."
            npm run android:add
          fi

      - name: Validate generated Android XML resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          resource_dir = Path("android/app/src/main/res")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not resource_dir.is_dir():
              raise SystemExit(f"Android resource directory not found: {resource_dir}")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest not found: {manifest}")

          files = sorted(resource_dir.rglob("*.xml")) + [manifest]
          errors = []
          for path in files:
              try:
                  ET.parse(path)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("Invalid Android XML resources:")
              print("\n".join(errors))
              raise SystemExit(1)

          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = resource_dir / "mipmap-anydpi-v26" / name
              if not path.is_file():
                  raise SystemExit(f"Adaptive launcher resource missing: {path}")
              text = path.read_text(encoding="utf-8-sig")
              if not text.lstrip().startswith("<?xml"):
                  raise SystemExit(f"XML declaration is not at the start of {path}")

          print(f"Validated {len(files)} Android XML files; launcher resources are valid.")
          PY

      - name: Compile debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package ID and archive
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "::error::Android aapt tool was not found."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.abyssal.game'"
          ls -lh "$APK"
          echo "APK archive and application ID verified."

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: the-abyssal-android-apk-4.1.0
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build completion summary
        if: success()
        shell: bash
        run: |
          echo "The Abyssal 4.1.0 Android APK built and passed package validation."
          echo "Download artifact: the-abyssal-android-apk-4.1.0"
          
