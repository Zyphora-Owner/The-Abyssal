name: Build The Abyssal 4.1.0 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: abyssal-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Reassemble source and compile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      # 2. Diagnose and reassemble archive
      - name: Reassemble source archive and verify SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail

          trap 'RC=$?; echo "::error::Failure at line ${LINENO}, exit code ${RC}"; exit "$RC"' ERR

          echo "========================================"
          echo "ABYSSAL_ARCHIVE_DIAGNOSTIC_V2"
          echo "THE ABYSSAL 4.1.0"
          echo "========================================"

          PART1="The_Abyssal_v4.1.0.zip.part01"
          PART2="The_Abyssal_v4.1.0.zip.part02"
          CHECKSUM_FILE="The_Abyssal_Standalone_Android_v4.1.0.zip.sha256"

          echo "Repository files:"
          ls -lah

          for FILE in "$PART1" "$PART2" "$CHECKSUM_FILE"; do
            if [[ ! -s "$FILE" ]]; then
              echo "::error::Missing or empty file: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
            stat -c 'SIZE: %s bytes' "$FILE"
          done

          ARCHIVE="$RUNNER_TEMP/The_Abyssal_Standalone_Android_v4.1.0.zip"

          echo "Reassembling archive..."
          cat "$PART1" "$PART2" > "$ARCHIVE"

          EXPECTED_SHA256="$(
            grep -Eo '[[:xdigit:]]{64}' "$CHECKSUM_FILE" | head -n 1 || true
          )"

          EXPECTED_SHA256="${EXPECTED_SHA256,,}"

          if [[ ! "$EXPECTED_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Invalid SHA-256 checksum."
            cat "$CHECKSUM_FILE"
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

          echo "EXPECTED: $EXPECTED_SHA256"
          echo "ACTUAL:   $ACTUAL_SHA256"

          if [[ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]]; then
            echo "::error::SHA-256 mismatch."
            exit 1
          fi

          echo "SHA-256 VERIFIED."

          echo "Checking ZIP integrity..."
          unzip -t "$ARCHIVE"

          EXTRACT_DIR="$RUNNER_TEMP/the-abyssal-v4.1.0"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting archive..."
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          echo "Detecting project root..."

          mapfile -t VERIFY_FILES < <(
            find "$EXTRACT_DIR" -type f -path '*/scripts/verify.mjs'
          )

          PROJECT_DIR=""

          for VERIFY_SCRIPT in "${VERIFY_FILES[@]}"; do
            CANDIDATE="$(dirname "$(dirname "$VERIFY_SCRIPT")")"

            if [[ -f "$CANDIDATE/package.json" ]] &&
               [[ -f "$CANDIDATE/index.html" ]]; then

              if [[ -n "$PROJECT_DIR" ]]; then
                echo "::error::Multiple project roots detected."
                exit 1
              fi

              PROJECT_DIR="$CANDIDATE"
            fi
          done

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Project root not found."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT ROOT: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ARCHIVE VALIDATION SUCCESSFUL."

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # 4. Java
      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 6. Backend
      - name: Validate optional Supabase configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/configure-backend.mjs

      # 7. Signing key
      - name: Verify stable debug signing key
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="native/abyssal-debug-signing.bin"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          echo "Signing key verified."

      # 8. Dependencies
      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install \
            --no-audit \
            --no-fund \
            --fetch-retries=4 \
            --fetch-timeout=180000

      # 9. Tests
      - name: Run complete source and asset verification
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm test

      # 10. Android preparation
      - name: Bundle game and prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d android ]]; then
            npm run android:sync
          else
            npm run android:add
          fi

      # 11. Compile APK
      - name: Compile debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --no-daemon --stacktrace assembleDebug

      # 12. Verify APK
      - name: Verify APK package ID and archive
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -t "$APK" >/dev/null

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          AAPT="$(
            find "$SDK_ROOT/build-tools" \
              -type f -name aapt | sort -V | tail -n 1
          )"

          test -n "$AAPT"

          "$AAPT" dump badging "$APK" \
            | grep -F "package: name='com.abyssal.game'"

          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: the-abyssal-android-apk-4.1.0
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 14. Completion
      - name: Build completion summary
        if: success()
        run: |
          echo "========================================"
          echo "THE ABYSSAL 4.1.0 BUILD SUCCESSFUL"
          echo "========================================"
          echo "Archive: VERIFIED"
          echo "SHA-256: VERIFIED"
          echo "Tests: PASSED"
          echo "Android APK: COMPILED"
          echo "Artifact: UPLOADED"
